[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-cortex"
version = "1.17.4"
description = "AI behavior governance for Claude Code — 55+ guards, input rewriting, LLM-as-Judge, A2A safety agent, zero-dep core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
]
authors = [
    { name = "AI King (Chen-Xuan Wang)", email = "me@ai-king.dev" },
]
keywords = [
    "claude-code",
    "anthropic",
    "hooks",
    "ai-safety",
    "guardrails",
    "llm-guard",
    "llm-security",
    "prompt-injection",
    "agent-governance",
    "agent-safety",
    "a2a",
    "multi-instance",
    "ai-assistant",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Individual layers
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
rag = [
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
    "bm25s>=0.2",
]
# Bundles
lite = []  # zero-dep, regex-only — explicitly named for clarity
all = [
    "cc-cortex[llm]",
    "cc-cortex[rag]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/anthropics-community/cc-cortex"
Repository = "https://github.com/anthropics-community/cc-cortex"
Documentation = "https://github.com/anthropics-community/cc-cortex#readme"
Issues = "https://github.com/anthropics-community/cc-cortex/issues"
Changelog = "https://github.com/anthropics-community/cc-cortex/blob/main/CHANGELOG.md"

[project.scripts]
cc-cortex = "cc_cortex.cli:main"
cc-guard = "cc_cortex.process_guard:main"
cc-scheduler = "cc_cortex.scheduler:main"
cc-skills = "cc_cortex.skills.installer:main"
cc-rag = "cc_cortex.rag:cli_main"
cc-handoff-index = "cc_cortex.handoff_index:main"
cc-handoff-tag = "cc_cortex.handoff_auto_tag:main"

[tool.hatch.build.targets.sdist]
include = ["src/cc_cortex", "knowledge"]
# _cognitive/ is in .gitignore (internal authoring flags) but the *.md
# cognitive prompts are tracked and packaged. Force-include bypasses
# hatchling's VCS-aware exclusion so sdist → wheel rebuild can find them.
[tool.hatch.build.targets.sdist.force-include]
"src/cc_cortex/_cognitive/three_layer.md" = "src/cc_cortex/_cognitive/three_layer.md"
"src/cc_cortex/_cognitive/first_principles.md" = "src/cc_cortex/_cognitive/first_principles.md"
"src/cc_cortex/_cognitive/prompt_select.md" = "src/cc_cortex/_cognitive/prompt_select.md"
"src/cc_cortex/_cognitive/debug_loop.md" = "src/cc_cortex/_cognitive/debug_loop.md"
"src/cc_cortex/_cognitive/decision_journal.md" = "src/cc_cortex/_cognitive/decision_journal.md"
"src/cc_cortex/_cognitive/pdca.md" = "src/cc_cortex/_cognitive/pdca.md"
"src/cc_cortex/_cognitive/judgment.md" = "src/cc_cortex/_cognitive/judgment.md"
"src/cc_cortex/_cognitive/awareness.md" = "src/cc_cortex/_cognitive/awareness.md"
"src/cc_cortex/_cognitive/learning_loop.md" = "src/cc_cortex/_cognitive/learning_loop.md"
"src/cc_cortex/_cognitive/__init__.py" = "src/cc_cortex/_cognitive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_cortex"]

[tool.hatch.build.targets.wheel.force-include]
"src/cc_cortex/skills/guard.md" = "cc_cortex/skills/guard.md"
"src/cc_cortex/skills/schedule.md" = "cc_cortex/skills/schedule.md"
"src/cc_cortex/skills/hooks.md" = "cc_cortex/skills/hooks.md"
"src/cc_cortex/_cognitive/__init__.py" = "cc_cortex/_cognitive/__init__.py"
"src/cc_cortex/_cognitive/three_layer.md" = "cc_cortex/_cognitive/three_layer.md"
"src/cc_cortex/_cognitive/first_principles.md" = "cc_cortex/_cognitive/first_principles.md"
"src/cc_cortex/_cognitive/prompt_select.md" = "cc_cortex/_cognitive/prompt_select.md"
"src/cc_cortex/_cognitive/debug_loop.md" = "cc_cortex/_cognitive/debug_loop.md"
"src/cc_cortex/_cognitive/decision_journal.md" = "cc_cortex/_cognitive/decision_journal.md"
"src/cc_cortex/_cognitive/pdca.md" = "cc_cortex/_cognitive/pdca.md"
"src/cc_cortex/_cognitive/judgment.md" = "cc_cortex/_cognitive/judgment.md"
"src/cc_cortex/_cognitive/awareness.md" = "cc_cortex/_cognitive/awareness.md"
"src/cc_cortex/_cognitive/learning_loop.md" = "cc_cortex/_cognitive/learning_loop.md"
"knowledge" = "cc_cortex/knowledge"
# templates/ 已由 packages 自動打包，不需 force-include
# force-include 會造成 duplicate name warning

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Platform-specific modules (fcntl, SIGKILL) → type: ignore in code
# Strict mode enabled for refactored packages

[[tool.mypy.overrides]]
module = [
    "cc_cortex.delivery.*",
    "cc_cortex.cognitive.*",
    "cc_cortex.process_guard.*",
    "cc_cortex.guards.*",
]
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/red_team_v3_100.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cc_cortex"]
omit = [
    "*/hooks/*",
    "*/_recycled/*",
    "*/git_assist.py",
    "*/linting.py",
    "*/typescript.py",
    "*/notify.py",
    "*/compact.py",
    "*/session.py",
    "*/cli.py",
]

[tool.coverage.report]
fail_under = 80
