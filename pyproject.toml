[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concinno"
version = "2.9.0"
description = "AI behavior governance for Claude Code - guards, input rewriting, LLM-as-Judge, A2A safety agent, zero-dep core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
]
authors = [
    { name = "AI King (Chen-Xuan Wang)", email = "me@ai-king.dev" },
]
keywords = [
    "hooks",
    "guardrails",
    "python",
    "governance",
    "agent",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Individual layers
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
rag = [
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
    "bm25s>=0.2",
]
# Sibling automation library — auto-generate Python APIs from any software.
# Shipped as an optional extra so Concinno consumers who want the full
# AI-King toolchain in one `pip install` can get it, while anyone who
# just needs Concinno's guard pipeline can skip the download.
api-anything = [
    "api-anything[all]>=0.2.1",
]
# Bundles
lite = []  # zero-dep, regex-only — explicitly named for clarity
all = [
    "concinno[llm]",
    "concinno[rag]",
    "concinno[api-anything]",
]
# Windows-only: browser automation + desktop control
windows = [
    "playwright>=1.40",
    "pywinauto>=0.6.8",
    "mss>=9.0",
    "pyperclip>=1.8",
]
# Windows full: everything (core + llm + rag + api-anything + windows)
windows-full = [
    "concinno[all]",
    "concinno[windows]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/aiking931931/concinno"
Repository = "https://github.com/aiking931931/concinno"
Documentation = "https://github.com/aiking931931/concinno#readme"
Issues = "https://github.com/aiking931931/concinno/issues"
Changelog = "https://github.com/aiking931931/concinno/blob/main/CHANGELOG.md"

[project.scripts]
concinno = "concinno.cli:main"
concinno-guard = "concinno.process_guard:main"
concinno-scheduler = "concinno.scheduler:main"
concinno-skills = "concinno.skills.installer:main"
concinno-rag = "concinno.rag:cli_main"
concinno-handoff-index = "concinno.handoff_index:main"
concinno-handoff-tag = "concinno.handoff_auto_tag:main"
concinno-ask-user-toast = "concinno.hooks.ask_user_toast:main"

[tool.hatch.build.targets.sdist]
include = ["src/concinno", "knowledge"]
# _cognitive/ is in .gitignore (internal authoring flags) but the *.md
# cognitive prompts are tracked and packaged. Force-include bypasses
# hatchling's VCS-aware exclusion so sdist → wheel rebuild can find them.
[tool.hatch.build.targets.sdist.force-include]
"src/concinno/_cognitive/three_layer.md" = "src/concinno/_cognitive/three_layer.md"
"src/concinno/_cognitive/first_principles.md" = "src/concinno/_cognitive/first_principles.md"
"src/concinno/_cognitive/prompt_select.md" = "src/concinno/_cognitive/prompt_select.md"
"src/concinno/_cognitive/debug_loop.md" = "src/concinno/_cognitive/debug_loop.md"
"src/concinno/_cognitive/decision_journal.md" = "src/concinno/_cognitive/decision_journal.md"
"src/concinno/_cognitive/pdca.md" = "src/concinno/_cognitive/pdca.md"
"src/concinno/_cognitive/judgment.md" = "src/concinno/_cognitive/judgment.md"
"src/concinno/_cognitive/awareness.md" = "src/concinno/_cognitive/awareness.md"
"src/concinno/_cognitive/learning_loop.md" = "src/concinno/_cognitive/learning_loop.md"
"src/concinno/_cognitive/__init__.py" = "src/concinno/_cognitive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/concinno"]

[tool.hatch.build.targets.wheel.force-include]
"src/concinno/skills/guard.md" = "concinno/skills/guard.md"
"src/concinno/skills/schedule.md" = "concinno/skills/schedule.md"
"src/concinno/skills/hooks.md" = "concinno/skills/hooks.md"
# Directory-bundled universal Skills (2.4.0) — picked up automatically
# by ``packages = ["src/concinno"]`` above. Listing them as force-include
# causes hatchling to write each file twice into the wheel ZIP and PyPI
# rejects the archive ("Duplicate filename in local headers").
"src/concinno/_cognitive/__init__.py" = "concinno/_cognitive/__init__.py"
"src/concinno/_cognitive/three_layer.md" = "concinno/_cognitive/three_layer.md"
"src/concinno/_cognitive/first_principles.md" = "concinno/_cognitive/first_principles.md"
"src/concinno/_cognitive/prompt_select.md" = "concinno/_cognitive/prompt_select.md"
"src/concinno/_cognitive/debug_loop.md" = "concinno/_cognitive/debug_loop.md"
"src/concinno/_cognitive/decision_journal.md" = "concinno/_cognitive/decision_journal.md"
"src/concinno/_cognitive/pdca.md" = "concinno/_cognitive/pdca.md"
"src/concinno/_cognitive/judgment.md" = "concinno/_cognitive/judgment.md"
"src/concinno/_cognitive/awareness.md" = "concinno/_cognitive/awareness.md"
"src/concinno/_cognitive/learning_loop.md" = "concinno/_cognitive/learning_loop.md"
"knowledge" = "concinno/knowledge"
# templates/ 已由 packages 自動打包，不需 force-include
# force-include 會造成 duplicate name warning

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Platform-specific modules (fcntl, SIGKILL) → type: ignore in code
# Strict mode enabled for refactored packages

[[tool.mypy.overrides]]
module = [
    "concinno.delivery.*",
    "concinno.cognitive.*",
    "concinno.process_guard.*",
    "concinno.guards.*",
]
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/red_team_v3_100.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["concinno"]
omit = [
    "*/hooks/*",
    "*/_recycled/*",
    "*/git_assist.py",
    "*/linting.py",
    "*/typescript.py",
    "*/notify.py",
    "*/compact.py",
    "*/session.py",
    "*/cli.py",
]

[tool.coverage.report]
fail_under = 80
