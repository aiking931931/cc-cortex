[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "concinno"
version = "2.35.1"
description = "AI behavior governance for Claude Code - guards, input rewriting, LLM-as-Judge, A2A safety agent, zero-dep core"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.0",
]
authors = [
    { name = "AI King (Chen-Xuan Wang)", email = "me@ai-king.dev" },
]
keywords = [
    "hooks",
    "guardrails",
    "python",
    "governance",
    "agent",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Individual layers
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
]
rag = [
    "chromadb>=1.0",
    "sentence-transformers>=5.0",
    "bm25s>=0.2",
]
# 2.15.0 reference tools — general-purpose information processing for
# agent benchmarks (GAIA / AgentBench / OSWorld). Each extras key maps to
# exactly one of the five deferred tools in
# ``concinno.tools.builtin.{pdf,html,sql,rss}``. ``all-tools`` pulls them
# all in one shot.
pdf = ["pypdf>=5", "pdfplumber>=0.11"]
html = ["trafilatura>=1.12"]
data = ["duckdb>=1.0"]
rss = ["feedparser>=6.0"]
all-tools = [
    "concinno[pdf]",
    "concinno[html]",
    "concinno[data]",
    "concinno[rss]",
]
# Windows toast — in-process WinRT via ``windows-toasts``. When installed,
# ``concinno.core.notify.show_toast`` uses Tier 1 (no ``.vbs`` on disk, no
# wscript subprocess, no Avast-family AV scan surface).
toast = [
    "windows-toasts>=1.3; platform_system == 'Windows'",
]
# Sibling automation library — analyze anything, control anything via LLM.
# Shipped as an optional extra so Concinno consumers who want the full
# AI-King toolchain in one `pip install` can get it, while anyone who
# just needs Concinno's guard pipeline can skip the download.
# Renamed 2026-04-20: api-anything → invoco → control-anything (see upstream
# CHANGELOG for rationale). The old extras key `api-anything` is no longer
# accepted; depend on `concinno[control-anything]` going forward.
control-anything = [
    "control-anything[all]>=0.1.0",
]
# Optional upstream MCP SDK — ``concinno.tools.mcp_bridge`` works
# without it (raw JSON-RPC 2.0 over stdio), but consumers who prefer
# Anthropic's official client can install via this extra.
mcp = [
    "mcp>=1.0",
]
# Local GGUF inference runtime — direct llama.cpp bypassing Ollama's
# degenerate-loop layer on Gemma 4 Q4_K_M (see docs/2.20.0-llamacpp-runtime.md).
# Pulls in the [server] extras so ``concinno.llm_runtime.LlamaCppServer``
# can spawn ``python -m llama_cpp.server`` out of the box. The wheel is
# large and CUDA-specific; not in ``all`` — opt in explicitly.
llm-local = [
    "llama-cpp-python[server]>=0.3",
]
# Bundles
lite = []  # zero-dep, regex-only — explicitly named for clarity
all = [
    "concinno[llm]",
    "concinno[rag]",
    "concinno[control-anything]",
]
# Windows-only: browser automation + desktop control
windows = [
    "playwright>=1.40",
    "pywinauto>=0.6.8",
    "mss>=9.0",
    "pyperclip>=1.8",
]
# Windows full: everything (core + llm + rag + control-anything + windows)
windows-full = [
    "concinno[all]",
    "concinno[control-anything]",
    "concinno[windows]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
]
# Config GUI — localhost FastAPI + single-page Vanilla JS frontend for
# visualizing / editing every FEATURE_META switch and ``~/.concinno/*.json``
# file without round-tripping through an LLM. Launch via ``concinno gui``.
# Kept out of ``all`` — only install when the operator wants the dashboard.
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/aiking931931/concinno"
Repository = "https://github.com/aiking931931/concinno"
Documentation = "https://github.com/aiking931931/concinno#readme"
Issues = "https://github.com/aiking931931/concinno/issues"
Changelog = "https://github.com/aiking931931/concinno/blob/main/CHANGELOG.md"

[project.entry-points."concinno.preset_consumers"]
# v4 preset cascade consumer group. External consumers register here and
# Concinno dispatches ``apply_preset(name)`` hooks when ``set_preset()``
# runs. The Concinno library itself is not a consumer — the block is
# declared so ``entry_points(group=...)`` never raises on an empty
# discovery. See ``docs/narrower-scope-v4-ziq-autotune.md`` §2.

[project.scripts]
concinno = "concinno.cli:main"
concinno-daemon = "concinno.daemon:main"
concinno-guard = "concinno.process_guard:main"
concinno-scheduler = "concinno.scheduler:main"
concinno-skills = "concinno.skills.installer:main"
concinno-rag = "concinno.rag:cli_main"
concinno-handoff-index = "concinno.handoff_index:main"
concinno-handoff-tag = "concinno.handoff_auto_tag:main"
concinno-ask-user-toast = "concinno.hooks.ask_user_toast:main"

[tool.hatch.build.targets.sdist]
include = ["src/concinno", "knowledge"]
# _cognitive/ is in .gitignore (internal authoring flags) but the *.md
# cognitive prompts are tracked and packaged. Force-include bypasses
# hatchling's VCS-aware exclusion so sdist → wheel rebuild can find them.
[tool.hatch.build.targets.sdist.force-include]
"src/concinno/_cognitive/three_layer.md" = "src/concinno/_cognitive/three_layer.md"
"src/concinno/_cognitive/first_principles.md" = "src/concinno/_cognitive/first_principles.md"
"src/concinno/_cognitive/prompt_select.md" = "src/concinno/_cognitive/prompt_select.md"
"src/concinno/_cognitive/debug_loop.md" = "src/concinno/_cognitive/debug_loop.md"
"src/concinno/_cognitive/decision_journal.md" = "src/concinno/_cognitive/decision_journal.md"
"src/concinno/_cognitive/pdca.md" = "src/concinno/_cognitive/pdca.md"
"src/concinno/_cognitive/judgment.md" = "src/concinno/_cognitive/judgment.md"
"src/concinno/_cognitive/awareness.md" = "src/concinno/_cognitive/awareness.md"
"src/concinno/_cognitive/learning_loop.md" = "src/concinno/_cognitive/learning_loop.md"
"src/concinno/_cognitive/__init__.py" = "src/concinno/_cognitive/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/concinno"]

[tool.hatch.build.targets.wheel.force-include]
"src/concinno/skills/guard.md" = "concinno/skills/guard.md"
"src/concinno/skills/schedule.md" = "concinno/skills/schedule.md"
"src/concinno/skills/hooks.md" = "concinno/skills/hooks.md"
# Directory-bundled universal Skills (2.4.0) — picked up automatically
# by ``packages = ["src/concinno"]`` above. Listing them as force-include
# causes hatchling to write each file twice into the wheel ZIP and PyPI
# rejects the archive ("Duplicate filename in local headers").
"src/concinno/_cognitive/__init__.py" = "concinno/_cognitive/__init__.py"
"src/concinno/_cognitive/three_layer.md" = "concinno/_cognitive/three_layer.md"
"src/concinno/_cognitive/first_principles.md" = "concinno/_cognitive/first_principles.md"
"src/concinno/_cognitive/prompt_select.md" = "concinno/_cognitive/prompt_select.md"
"src/concinno/_cognitive/debug_loop.md" = "concinno/_cognitive/debug_loop.md"
"src/concinno/_cognitive/decision_journal.md" = "concinno/_cognitive/decision_journal.md"
"src/concinno/_cognitive/pdca.md" = "concinno/_cognitive/pdca.md"
"src/concinno/_cognitive/judgment.md" = "concinno/_cognitive/judgment.md"
"src/concinno/_cognitive/awareness.md" = "concinno/_cognitive/awareness.md"
"src/concinno/_cognitive/learning_loop.md" = "concinno/_cognitive/learning_loop.md"
"knowledge" = "concinno/knowledge"
# templates/ 已由 packages 自動打包，不需 force-include
# force-include 會造成 duplicate name warning

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
# Platform-specific modules (fcntl, SIGKILL) → type: ignore in code
# Strict mode enabled for refactored packages

[[tool.mypy.overrides]]
module = [
    "concinno.delivery.*",
    "concinno.cognitive.*",
    "concinno.process_guard.*",
    "concinno.guards.*",
]
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/red_team_v3_100.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["concinno"]
omit = [
    "*/hooks/*",
    "*/_recycled/*",
    "*/git_assist.py",
    "*/linting.py",
    "*/typescript.py",
    "*/notify.py",
    "*/compact.py",
    "*/session.py",
    "*/cli.py",
]

[tool.coverage.report]
fail_under = 80
