repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [check, --select=E,F,I,W, --fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (quick smoke)
        entry: python -m pytest -x -q --tb=short --no-header -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
