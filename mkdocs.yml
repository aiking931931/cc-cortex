site_name: CC Cortex
site_description: The Cognitive Layer for Claude Code
site_url: https://anthropics-community.github.io/tempero
repo_url: https://github.com/anthropics-community/tempero
repo_name: anthropics-community/tempero
copyright: Copyright &copy; 2026 AI King (Chen-Xuan Wang) — Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            separate_signature: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: three-layer-cognitive-architecture.md
  - Handoff Modes: handoff-modes.md
  - Comparison: comparison.md
  - Migration v0.5 → v0.6: migration-v05-v06.md
  - Whitepaper: whitepaper.md
  - API Reference:
      - Boundary Guard: api/boundary_guard.md
      - Token Monitor: api/token_monitor.md
      - Token Zone: api/token_zone.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
